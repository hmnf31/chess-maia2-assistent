<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a; color: #e8e6e3;
            width: 320px; padding: 0; font-size: 13px;
        }
        .header {
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            padding: 14px 16px; text-align: center;
            border-bottom: 2px solid #81b64c;
        }
        .header h2 {
            color: #81b64c; font-size: 15px; font-weight: 700;
            letter-spacing: 0.3px;
        }
        .header span { color: #6a6a6a; font-size: 11px; display: block; margin-top: 2px; }
        .content { padding: 10px 12px 12px; }
        .group {
            background: #252423; border-radius: 8px;
            padding: 12px; margin-bottom: 8px;
            border: 1px solid #333230;
        }
        .group-title {
            font-size: 11px; font-weight: 600; color: #81b64c;
            text-transform: uppercase; letter-spacing: 0.8px;
            margin-bottom: 10px; padding-bottom: 6px;
            border-bottom: 1px solid #333230;
        }
        .field { margin-bottom: 10px; }
        .field:last-child { margin-bottom: 0; }
        .field label {
            display: block; font-size: 11px; font-weight: 500;
            color: #b0aca8; margin-bottom: 4px;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%; background: #121110; color: #e8e6e3;
            border: 1px solid #3a3835; padding: 8px 10px;
            border-radius: 5px; outline: none;
            font-size: 13px; transition: border 0.2s;
        }
        select:focus, input:focus { border-color: #81b64c; }
        select { cursor: pointer; appearance: auto; }
        .elo-row { display: flex; gap: 8px; }
        .elo-row .field { flex: 1; margin-bottom: 0; }
        .desc-text { font-size: 11px; color: #81b64c; margin-top: 4px; font-style: italic; }
        .toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid #1f1e1c;
        }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-row label { font-size: 12px; color: #d0ccc8; cursor: pointer; margin: 0; }
        .switch { position: relative; display: inline-block; width: 36px; height: 18px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #3a3835; transition: .25s; border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 2px; bottom: 2px; background: #888; transition: .25s; border-radius: 50%;
        }
        input:checked + .slider { background: #81b64c; }
        input:checked + .slider:before { background: #fff; transform: translateX(18px); }
        .btn {
            width: 100%; background: #81b64c; color: #fff;
            border: none; padding: 10px; border-radius: 6px;
            font-weight: 600; font-size: 13px; cursor: pointer;
            transition: background 0.2s; margin-top: 4px;
        }
        .btn:hover { background: #6e9d40; }
        .btn:active { background: #5c8a34; }
        .btn-small {
            padding: 6px 10px; font-size: 11px; margin-top: 6px;
            background: #3a3835; border-radius: 4px; border: none;
            color: #b0aca8; cursor: pointer; transition: 0.2s;
        }
        .btn-small:hover { background: #4a4845; color: #fff; }
        #status {
            text-align: center; color: #81b64c; font-size: 11px;
            padding: 6px; display: none; font-weight: 500;
        }
        #status.show { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .server-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: #b0aca8; margin-top: 6px;
        }
        .server-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #555; flex-shrink: 0;
        }
        .server-dot.online { background: #81b64c; }
        .server-dot.offline { background: #e74c3c; }
        .server-dot.checking { background: #f39c12; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .server-row { display: flex; gap: 6px; }
        .server-row input { flex: 1; }
        .server-row .btn-small { margin: 0; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Maia-2 Engine</h2>
        <span>Human-like Chess Assistant</span>
    </div>

    <div class="content">
        <div class="group">
            <div class="group-title">Server</div>
            <div class="server-row">
                <input type="text" id="serverUrl" value="https://hmnf31-maia2online.hf.space" placeholder="https://hmnf31-maia2online.hf.space">
                <button class="btn-small" id="testBtn">Test</button>
            </div>
            <div class="server-status">
                <span class="server-dot" id="serverDot"></span>
                <span id="serverLabel">Not connected</span>
            </div>
        </div>

        <div class="group">
            <div class="group-title">Persona</div>
            <div class="field">
                <label>Kepribadian</label>
                <select id="personaSelect">
                    <option value="beginner">Pemula Antusias (1200)</option>
                    <option value="club_player" selected>Pemain Klub (1500)</option>
                    <option value="tournament">Tournament Grinder (1800)</option>
                    <option value="talented_youth">Talenta Muda (2100)</option>
                    <option value="master">Master Senior (2400)</option>
                    <option value="joker">The Joker (1400)</option>
                </select>
                <div id="personaDesc">Main solid seperti pemain klub mingguan</div>
            </div>
        </div>

        <div class="group">
            <div class="group-title">Game</div>
            <div class="field">
                <label>Mode</label>
                <select id="gameMode">
                    <option value="blitz" selected>Blitz</option>
                    <option value="rapid">Rapid</option>
                </select>
            </div>
            <div class="elo-row" style="margin-top:8px;">
                <div class="field">
                    <label>My ELO</label>
                    <input type="number" id="eloSelf" value="1500" min="800" max="3500">
                </div>
                <div class="field">
                    <label>Opponent</label>
                    <input type="number" id="eloOppo" value="1500" min="800" max="3500">
                </div>
            </div>
        </div>

        <div class="group">
            <div class="group-title">Display</div>
            <div class="toggle-row">
                <label>Arrows</label>
                <label class="switch"><input type="checkbox" id="arrowToggle" checked><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
                <label>Multi-Line (Top 5)</label>
                <label class="switch"><input type="checkbox" id="multiLineToggle" checked><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
                <label>Eval Bar</label>
                <label class="switch"><input type="checkbox" id="evalToggle" checked><span class="slider"></span></label>
            </div>
        </div>

        <div class="group">
            <div class="group-title">Analysis</div>
            <div class="toggle-row">
                <label>Blunder Warning</label>
                <label class="switch"><input type="checkbox" id="blunderToggle" checked><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
                <label>End Game Analysis</label>
                <label class="switch"><input type="checkbox" id="analysisToggle" checked><span class="slider"></span></label>
            </div>
        </div>

        <button class="btn" id="saveBtn">Simpan</button>
        <div id="status">Pengaturan tersimpan</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
