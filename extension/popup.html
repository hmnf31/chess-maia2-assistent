<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #262421; color: #fff; width: 290px; margin: 0; padding: 15px; }
        h2 { text-align: center; color: #81b64c; margin-top: 0; font-size: 16px; border-bottom: 2px solid #312e2b; padding-bottom: 10px; }
        .control-group { margin-bottom: 12px; background: #312e2b; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 12px; color: #c3c2c1; }
        select, input[type="number"] { width: 100%; background: #121110; color: #fff; border: 1px solid #454341; padding: 8px; border-radius: 4px; outline: none; box-sizing: border-box; }
        .desc-text { font-size: 11px; color: #8a8a8a; margin-top: 4px; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
        .toggle-row label { margin: 0; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #454341; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: #81b64c; }
        input:checked + .slider:before { transform: translateX(20px); }
        .btn { width: 100%; background: #81b64c; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn:hover { background: #6e9d40; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        #status { text-align: center; color: #81b64c; font-size: 12px; margin-top: 10px; display: none; }
        #personaDesc { font-size: 11px; color: #81b64c; margin-top: 4px; font-style: italic; }
        .section-title { font-size: 13px; color: #81b64c; margin: 4px 0 8px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Maia-2 Human Config</h2>

    <div class="control-group">
        <label>Persona / Kepribadian:</label>
        <select id="personaSelect">
            <option value="beginner">Pemula Antusias (1200)</option>
            <option value="club_player" selected>Pemain Klub (1500)</option>
            <option value="tournament">Tournament Grinder (1800)</option>
            <option value="talented_youth">Talenta Muda (2100)</option>
            <option value="master">Master Senior (2400)</option>
            <option value="joker">The Joker (1400)</option>
        </select>
        <div id="personaDesc">Seperti pemain klub mingguan</div>
    </div>

    <div class="control-group">
        <div class="section-title">Settings</div>
        <label>Game Mode:</label>
        <select id="gameMode">
            <option value="blitz" selected>Blitz</option>
            <option value="rapid">Rapid</option>
        </select>
    </div>

    <div class="control-group">
        <label>My ELO:</label>
        <input type="number" id="eloSelf" value="1500" min="800" max="3500">
        <label style="margin-top:8px;">Opponent ELO:</label>
        <input type="number" id="eloOppo" value="1500" min="800" max="3500">
    </div>

    <div class="control-group">
        <div class="section-title">Toggles</div>
        <div class="toggle-row">
            <label>Show Arrows</label>
            <label class="switch"><input type="checkbox" id="arrowToggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <label>Multi-Line (Top 5)</label>
            <label class="switch"><input type="checkbox" id="multiLineToggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <label>Eval Bar</label>
            <label class="switch"><input type="checkbox" id="evalToggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <label>Blunder Warning</label>
            <label class="switch"><input type="checkbox" id="blunderToggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <label>End Game Analysis</label>
            <label class="switch"><input type="checkbox" id="analysisToggle" checked><span class="slider"></span></label>
        </div>
    </div>

    <button class="btn" id="saveBtn">Simpan Pengaturan</button>
    <div id="status">Pengaturan Tersimpan!</div>

    <script src="popup.js"></script>
</body>
</html>
