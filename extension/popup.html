<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #262421; color: #fff; width: 260px; margin: 0; padding: 15px; }
        h2 { text-align: center; color: #81b64c; margin-top: 0; font-size: 16px; border-bottom: 2px solid #312e2b; padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; background: #312e2b; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 12px; color: #c3c2c1; }
        select, input[type="number"] { width: 100%; background: #121110; color: #fff; border: 1px solid #454341; padding: 8px; border-radius: 4px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; background: #81b64c; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn:hover { background: #6e9d40; }
        #status { text-align: center; color: #81b64c; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <h2>♟️ Maia-2 Config</h2>
    
    <div class="control-group">
        <label>Game Mode:</label>
        <select id="gameMode">
            <option value="blitz" selected>⚡ Blitz</option>
            <option value="rapid">⏱️ Rapid</option>
        </select>
    </div>

    <div class="control-group">
        <label>My Target ELO (elo_self):</label>
        <input type="number" id="eloSelf" value="2800" min="1000" max="3500">
    </div>

    <div class="control-group">
        <label>Opponent ELO (elo_oppo):</label>
        <input type="number" id="eloOppo" value="2750" min="1000" max="3500">
    </div>

    <button class="btn" id="saveBtn">Simpan Pengaturan</button>
    <div id="status">Pengaturan Tersimpan!</div>

    <script src="popup.js"></script>
</body>
</html>
